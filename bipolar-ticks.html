<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Citizen's Blueprint: From Advocacy to Action</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .step-transition { transition: all 0.3s ease-in-out; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const roadmapSteps = [
            {
                id: 1,
                title: "The Reality Check",
                subtitle: "Understanding the 'Why' behind the bans.",
                category: "Perspective",
                content: "The recent push against hemp isn't about public safety; it's about market control. The alcohol industry and large multi-state corporate marijuana operators are lobbying hard to crush independent hemp because it threatens their profits. They use 'protecting kids' as a shield. Meanwhile, significantly more toxic and addictive substances like alcohol, sugar, and caffeine remain completely normalized and aggressively marketed.",
                action: "When debating this, call out the hypocrisy. Focus on the financial motivations (follow the money to political donors) and the biological reality of toxicity rather than just arguing 'weed should be legal'.",
                icon: (
                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                )
            },
            {
                id: 2,
                title: "Grassroots Disruption",
                subtitle: "Taking immediate action as a citizen.",
                category: "Activism",
                content: "Before you can run the system, you have to push back against it. State agencies like the DSHS take orders from the Texas Legislature (specifically leaders like Dan Patrick). The real battleground for hemp is the upcoming 2027 legislative session, but the groundwork and lawsuits start right now.",
                action: "Use Texas's 'Who Represents Me?' tool to find your specific Dallas/Plano state reps. Call their offices directly—do not just email. Support the Texas Hemp Business Council (THBC) and spend money at local, compliant shops to fund their legal defense.",
                icon: (
                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z"></path></svg>
                )
            },
            {
                id: 3,
                title: "Entering the Arena",
                subtitle: "Getting your foot in the political door.",
                category: "Career",
                content: "If you are tired of uninformed people running things, you have to get inside. Political campaigns desperately need capable people, but they hire who they know and trust. The easiest way in is proving you can handle the chaotic environment of a campaign.",
                action: "Start as a highly targeted volunteer or apply to be a paid Texas Election Worker. Be upfront with campaign managers: tell them you are looking for a paid role. Prove your worth by showing up consistently and organizing efficiently.",
                icon: (
                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                )
            },
            {
                id: 4,
                title: "The Tech Advantage",
                subtitle: "Leveraging your AWS and Dev skills.",
                category: "Career",
                content: "This is your superpower and how you skip the line. You have AWS, Python, FastAPI, and React skills. Political campaigns generate massive amounts of voter data (polling, donor lists, canvassing routes) but often lack the in-house tech talent to manage it.",
                action: "Pitch yourself as a Digital/Data Coordinator. Offer to automate their voter outreach data pipelines using Python, or build internal tracking dashboards using React and AWS. This is highly specialized, highly valued, and well-paid campaign work.",
                icon: (
                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>
                )
            },
            {
                id: 5,
                title: "Getting Paid",
                subtitle: "Securing the bag in Texas politics.",
                category: "Income",
                content: "Once you have the network or the tech portfolio ready to show, it's time to apply for the real checks. The political industry has its own ecosystem for hiring; standard job boards won't cut it.",
                action: "Check 'Texas Political Jobs', 'Daybook' (filter for Austin/Dallas), and 'Arena Careers'. Look for job titles like 'Deputy Data Director', 'Digital Organizer', 'Field Coordinator', or 'Legislative Aide'.",
                icon: (
                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                )
            }
        ];

        const App = () => {
            const [activeStep, setActiveStep] = useState(1);

            return (
                <div className="min-h-screen p-8 max-w-6xl mx-auto">
                    <header className="mb-12 text-center md:text-left">
                        <h1 className="text-4xl md:text-5xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-green-400 to-blue-500 mb-4">
                            The Citizen's Blueprint
                        </h1>
                        <p className="text-slate-400 text-lg max-w-2xl">
                            A step-by-step roadmap to understanding the political hypocrisy behind hemp bans, taking action, and leveraging your tech skills to get paid to make an actual difference.
                        </p>
                    </header>

                    <div className="flex flex-col md:flex-row gap-8">
                        {/* Sidebar Navigation */}
                        <div className="md:w-1/3 flex flex-col gap-4 relative">
                            <div className="absolute left-6 top-6 bottom-6 w-0.5 bg-slate-700 hidden md:block z-0"></div>
                            
                            {roadmapSteps.map((step) => (
                                <button
                                    key={step.id}
                                    onClick={() => setActiveStep(step.id)}
                                    className={`relative z-10 flex items-center gap-4 p-4 rounded-xl text-left step-transition ${
                                        activeStep === step.id 
                                        ? 'glass-panel border-green-500/50 shadow-[0_0_15px_rgba(34,197,94,0.2)]' 
                                        : 'hover:bg-slate-800/50 border border-transparent'
                                    }`}
                                >
                                    <div className={`flex items-center justify-center w-12 h-12 rounded-full ${
                                        activeStep === step.id ? 'bg-green-500 text-slate-900' : 'bg-slate-800 text-slate-400'
                                    }`}>
                                        {step.icon}
                                    </div>
                                    <div>
                                        <div className={`text-xs font-semibold uppercase tracking-wider mb-1 ${
                                            activeStep === step.id ? 'text-green-400' : 'text-slate-500'
                                        }`}>
                                            Step {step.id}: {step.category}
                                        </div>
                                        <div className="font-semibold text-lg">{step.title}</div>
                                    </div>
                                </button>
                            ))}
                        </div>

                        {/* Main Content Area */}
                        <div className="md:w-2/3">
                            {roadmapSteps.map((step) => (
                                <div 
                                    key={step.id}
                                    className={`${activeStep === step.id ? 'block' : 'hidden'} animate-[fadeIn_0.5s_ease-in-out]`}
                                >
                                    <div className="glass-panel p-8 rounded-2xl">
                                        <div className="inline-block px-3 py-1 bg-slate-800 rounded-full text-green-400 text-sm font-semibold mb-6">
                                            {step.category} Focus
                                        </div>
                                        <h2 className="text-3xl font-bold mb-2">{step.title}</h2>
                                        <h3 className="text-xl text-slate-400 mb-8 pb-4 border-b border-slate-700">
                                            {step.subtitle}
                                        </h3>
                                        
                                        <div className="space-y-6">
                                            <div>
                                                <h4 className="flex items-center gap-2 text-lg font-semibold text-blue-400 mb-2">
                                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                                    The BS Check
                                                </h4>
                                                <p className="text-slate-300 leading-relaxed">
                                                    {step.content}
                                                </p>
                                            </div>

                                            <div className="bg-slate-800/50 p-6 rounded-xl border border-slate-700">
                                                <h4 className="flex items-center gap-2 text-lg font-semibold text-green-400 mb-2">
                                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                                                    Action Plan
                                                </h4>
                                                <p className="text-slate-200 leading-relaxed font-medium">
                                                    {step.action}
                                                </p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</body>
</html>
