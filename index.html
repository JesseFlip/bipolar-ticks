        function NewsTicker() {
            const [state, setState] = useState({ status: "loading", items: [] });

            useEffect(() => {
                let cancelled = false;
                fetch("/api/news")
                    .then((res) => {
                        if (!res.ok) throw new Error("bad response");
                        return res.json();
                    })
                    .then((data) => {
                        if (cancelled) return;
                        if (!data.items || data.items.length === 0) {
                            setState({ status: "empty", items: [] });
                        } else {
                            setState({ status: "ready", items: data.items, fetchedAt: data.fetchedAt });
                        }
                    })
                    .catch(() => {
                        if (!cancelled) setState({ status: "error", items: [] });
                    });
                return () => { cancelled = true; };
            }, []);

            if (state.status === "loading") {
                return (
                    <div className="w-full bg-slate-900 border-b border-slate-800 text-xs md:text-sm text-slate-500 py-2 px-4 text-center">
                        Loading the latest hemp-policy headlines…
                    </div>
                );
            }

            if (state.status === "error" || state.status === "empty") {
                return (
                    <div className="w-full bg-slate-900 border-b border-slate-800 text-xs md:text-sm text-slate-500 py-2 px-4 text-center">
                        Live headline feed is temporarily unavailable — check back soon.
                    </div>
                );
            }

            const items = [...state.items, ...state.items];

            return (
                <div className="marquee-wrap w-full bg-slate-900 border-b border-green-500/20 overflow-hidden whitespace-nowrap py-2">
                    <div className="marquee-track inline-flex items-center gap-10">
                        {items.map((item, i) => (
                            <a
                                key={i}
                                href={item.link}
                                target="_blank"
                                rel="noopener noreferrer"
                                className="inline-flex items-center gap-2 text-xs md:text-sm text-slate-300 hover:text-green-400 transition-colors"
                            >
                                <span className="w-1.5 h-1.5 rounded-full bg-green-500 shrink-0"></span>
                                <span>{item.title}</span>
                                {item.source && <span className="text-slate-600">— {item.source}</span>}
                            </a>
                        ))}
                    </div>
                </div>
            );
        }

                        ))}
                    </div>

                    <div className="md:w-2/3">
                        {roadmapSteps.map((step) => (
                            <div
                                key={step.id}
                                className={`${activeStep === step.id ? 'block' : 'hidden'} animate-[fadeIn_0.5s_ease-in-out]`}
                            >
                                <div className="glass-panel p-8 rounded-2xl">
                                    <div className="inline-block px-3 py-1 bg-slate-800 rounded-full text-green-400 text-sm font-semibold mb-6">
                                        {step.category} Focus
                                    </div>
                                    <h2 className="text-3xl font-bold mb-2">{step.title}</h2>
                                    <h3 className="text-xl text-slate-400 mb-8 pb-4 border-b border-slate-700">
                                        {step.subtitle}
                                    </h3>

                                    <div className="space-y-6">
                                        <div>
                                            <h4 className="flex items-center gap-2 text-lg font-semibold text-blue-400 mb-2">
                                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                                The BS Check
                                            </h4>
                                            <p className="text-slate-300 leading-relaxed">
                                                {step.content}
                                            </p>
                                        </div>

                                        {step.keyPoints && (
                                            <div>
                                                <h4 className="flex items-center gap-2 text-lg font-semibold text-purple-400 mb-3">
                                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                                    What's Really Going On
                                                </h4>
                                                <ul className="space-y-2">
                                                    {step.keyPoints.map((point, i) => (
                                                        <li key={i} className="flex gap-3 text-slate-300 leading-relaxed">
                                                            <span className="text-purple-400 mt-1">•</span>
                                                            <span>{point}</span>
                                                        </li>
                                                    ))}
                                                </ul>
                                            </div>
                                        )}

                                        <div className="bg-slate-800/50 p-6 rounded-xl border border-slate-700">
                                            <h4 className="flex items-center gap-2 text-lg font-semibold text-green-400 mb-2">
                                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                                                Action Plan
                                            </h4>
                                            <p className="text-slate-200 leading-relaxed font-medium mb-4">
                                                {step.action}
                                            </p>
                                            {step.nextSteps && (
                                                <ol className="space-y-2 list-decimal list-inside">
                                                    {step.nextSteps.map((s, i) => (
                                                        <li key={i} className="text-slate-300 leading-relaxed">{s}</li>
                                                    ))}
                                                </ol>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        /* ------------------------------------------------------------------ */
        /* Skills Assessment                                                   */
        /* ------------------------------------------------------------------ */

        function SkillsAssessment({ onJumpToStep }) {
            const [answers, setAnswers] = useState([]);
            const [qIndex, setQIndex] = useState(0);
            const [result, setResult] = useState(null);

            const choose = (tag) => {
                const next = [...answers, tag];
                setAnswers(next);
                if (qIndex + 1 < QUIZ_QUESTIONS.length) {
                    setQIndex(qIndex + 1);
                } else {
                    const tally = {};
                    next.forEach((t) => { tally[t] = (tally[t] || 0) + 1; });
                    const top = Object.entries(tally).sort((a, b) => b[1] - a[1])[0][0];
                    setResult(top);
                }
            };

            const restart = () => {
                setAnswers([]);
                setQIndex(0);
                setResult(null);
            };

            if (result) {
                const info = RESULT_INFO[result];
                return (
                    <div className="glass-panel p-8 rounded-2xl text-center max-w-2xl mx-auto">
                        <div className="inline-block px-3 py-1 bg-slate-800 rounded-full text-green-400 text-sm font-semibold mb-4">
                            Your Result
                        </div>
                        <h3 className="text-3xl font-bold mb-3">{info.title}</h3>
                        <p className="text-slate-300 leading-relaxed mb-8">{info.blurb}</p>
                        <div className="flex flex-col sm:flex-row gap-3 justify-center">
                            <button
                                onClick={() => onJumpToStep(info.stepId)}
                                className="px-6 py-3 rounded-xl bg-green-500 text-slate-900 font-semibold hover:bg-green-400 transition-colors"
                            >
                                See Where You Fit In the Roadmap
                            </button>
                            <button
                                onClick={restart}
                                className="px-6 py-3 rounded-xl bg-slate-800 text-slate-300 font-semibold hover:bg-slate-700 transition-colors border border-slate-700"
                            >
                                Retake Assessment
                            </button>
                        </div>
                    </div>
                );
            }

            const question = QUIZ_QUESTIONS[qIndex];

            return (
                <div className="glass-panel p-8 rounded-2xl max-w-2xl mx-auto">
                    <div className="flex justify-between items-center mb-6">
                        <span className="text-sm text-slate-500 font-semibold">
                            Question {qIndex + 1} of {QUIZ_QUESTIONS.length}
                        </span>
                        <div className="w-32 h-1.5 bg-slate-800 rounded-full overflow-hidden">
                            <div
                                className="h-full bg-green-500 transition-all duration-300"
                                style={{ width: `${((qIndex) / QUIZ_QUESTIONS.length) * 100}%` }}
                            ></div>
                        </div>
                    </div>
                    <h3 className="text-2xl font-bold mb-6">{question.prompt}</h3>
                    <div className="flex flex-col gap-3">
                        {question.options.map((opt, i) => (
                            <button
                                key={i}
                                onClick={() => choose(opt.tag)}
                                className="text-left px-5 py-4 rounded-xl bg-slate-800/60 hover:bg-slate-700 border border-slate-700 hover:border-green-500/50 transition-colors text-slate-200"
                            >
                                {opt.label}
                            </button>
                        ))}
                    </div>
                    {qIndex > 0 && (
                        <button
                            onClick={() => { setQIndex(qIndex - 1); setAnswers(answers.slice(0, -1)); }}
                            className="mt-6 text-sm text-slate-500 hover:text-slate-300"
                        >
                            ← Back
                        </button>
                    )}
                </div>
            );
        }

        /* ------------------------------------------------------------------ */
        /* FAQ                                                                 */
        /* ------------------------------------------------------------------ */

        function FaqSection() {
            const [open, setOpen] = useState(null);
            return (
                <div className="max-w-3xl mx-auto flex flex-col gap-3">
                    {faqItems.map((item, i) => (
                        <div key={i} className="glass-panel rounded-xl overflow-hidden">
                            <button
                                onClick={() => setOpen(open === i ? null : i)}
                                className="w-full text-left px-6 py-4 flex justify-between items-center gap-4"
                            >
                                <span className="font-semibold text-slate-200">{item.q}</span>
                                <span className={`text-green-400 text-xl step-transition ${open === i ? 'rotate-45' : ''}`}>+</span>
                            </button>
                            {open === i && (
                                <div className="px-6 pb-5 text-slate-400 leading-relaxed">
                                    {item.a}
                                </div>
                            )}
                        </div>
                    ))}
                </div>
            );
        }

        /* ------------------------------------------------------------------ */
        /* Comments / Discussion                                              */
        /* ------------------------------------------------------------------ */

        function timeAgo(iso) {
            const diff = Math.max(0, Date.now() - new Date(iso).getTime());
            const mins = Math.floor(diff / 60000);
            if (mins < 1) return "just now";
            if (mins < 60) return `${mins}m ago`;
            const hours = Math.floor(mins / 60);
            if (hours < 24) return `${hours}h ago`;
            const days = Math.floor(hours / 24);
            return `${days}d ago`;
        }

        function CommentsSection() {
            const [status, setStatus] = useState("loading");
            const [comments, setComments] = useState([]);
            const [name, setName] = useState("");
            const [text, setText] = useState("");
            const [website, setWebsite] = useState("");
            const [submitting, setSubmitting] = useState(false);
            const [submitError, setSubmitError] = useState(null);

            const load = useCallback(() => {
                setStatus("loading");
                fetch("/api/comments")
                    .then((res) => {
                        if (!res.ok) throw new Error("bad response");
                        return res.json();
                    })
                    .then((data) => {
                        setComments(Array.isArray(data) ? data.slice().reverse() : []);
                        setStatus("ready");
                    })
                    .catch(() => setStatus("error"));
            }, []);

            useEffect(() => { load(); }, [load]);

            const submit = (e) => {
                e.preventDefault();
                if (!text.trim()) return;
                setSubmitting(true);
                setSubmitError(null);
                fetch("/api/comments", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name, text, website })
                })
                    .then((res) => {
                        if (!res.ok) throw new Error("failed");
                        return res.json();
                    })
                    .then((comment) => {
                        setComments([comment, ...comments]);
                        setText("");
                    })
                    .catch(() => setSubmitError("Couldn't post your comment. Please try again in a moment."))
                    .finally(() => setSubmitting(false));
            };

            return (
                <div className="max-w-3xl mx-auto">
                    <form onSubmit={submit} className="glass-panel p-6 rounded-2xl mb-8">
                        <h3 className="text-xl font-bold mb-4">Join the Discussion</h3>
                        <div className="flex flex-col gap-3">
                            <input
                                type="text"
                                value={name}
                                onChange={(e) => setName(e.target.value)}
                                placeholder="Name (optional)"
                                maxLength={60}
                                className="px-4 py-3 rounded-lg bg-slate-800 border border-slate-700 text-slate-200 placeholder-slate-500 focus:outline-none focus:border-green-500/50"
                            />
                            {/* Honeypot field, hidden from real users */}
                            <input
                                type="text"
                                value={website}
                                onChange={(e) => setWebsite(e.target.value)}
                                tabIndex={-1}
                                autoComplete="off"
                                className="hidden"
                                aria-hidden="true"
                            />
                            <textarea
                                value={text}
                                onChange={(e) => setText(e.target.value)}
                                placeholder="Share a thought, a lead, or a question…"
                                maxLength={1000}
                                rows={4}
                                required
                                className="px-4 py-3 rounded-lg bg-slate-800 border border-slate-700 text-slate-200 placeholder-slate-500 focus:outline-none focus:border-green-500/50 resize-none"
                            />
                            <div className="flex justify-between items-center">
                                <span className="text-xs text-slate-500">{text.length}/1000</span>
                                <button
                                    type="submit"
                                    disabled={submitting || !text.trim()}
                                    className="px-6 py-2.5 rounded-lg bg-green-500 text-slate-900 font-semibold hover:bg-green-400 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
                                >
                                    {submitting ? "Posting…" : "Post Comment"}
                                </button>
                            </div>
                            {submitError && <p className="text-red-400 text-sm">{submitError}</p>}
                        </div>
                    </form>

                    {status === "loading" && (
                        <p className="text-slate-500 text-center">Loading comments…</p>
                    )}
                    {status === "error" && (
                        <p className="text-slate-500 text-center">Comments are unavailable right now. Please check back soon.</p>
                    )}
                    {status === "ready" && comments.length === 0 && (
                        <p className="text-slate-500 text-center">No comments yet — be the first to weigh in.</p>
                    )}
                    {status === "ready" && comments.length > 0 && (
                        <div className="flex flex-col gap-4">
                            {comments.map((c) => (
                                <div key={c.id} className="glass-panel p-5 rounded-xl">
                                    <div className="flex justify-between items-baseline mb-2">
                                        <span className="font-semibold text-green-400">{c.name}</span>
                                        <span className="text-xs text-slate-500">{timeAgo(c.createdAt)}</span>
                                    </div>
                                    <p className="text-slate-300 leading-relaxed whitespace-pre-wrap">{c.text}</p>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        /* ------------------------------------------------------------------ */
        /* App                                                                 */
        /* ------------------------------------------------------------------ */

        function SectionHeading({ eyebrow, title, subtitle }) {
            return (
                <div className="text-center mb-10">
                    <div className="inline-block px-3 py-1 bg-slate-800 rounded-full text-green-400 text-sm font-semibold mb-4">
                        {eyebrow}
                    </div>
                    <h2 className="text-3xl md:text-4xl font-bold mb-3">{title}</h2>
                    {subtitle && <p className="text-slate-400 max-w-2xl mx-auto">{subtitle}</p>}
                </div>
            );
        }

        const App = () => {
            const [activeStep, setActiveStep] = useState(1);

            const jumpToStep = (id) => {
                setActiveStep(id);
                const el = document.getElementById("roadmap");
                if (el) el.scrollIntoView({ behavior: "smooth" });
            };

            return (
                <React.Fragment>
                    <NewsTicker />
                    <div className="min-h-screen p-8 max-w-6xl mx-auto">
                        <header className="mb-8 text-center md:text-left">
                            <h1 className="text-4xl md:text-5xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-green-400 to-blue-500 mb-4">
                                The Citizen's Blueprint
                            </h1>
                            <p className="text-slate-400 text-lg max-w-2xl">
                                A step-by-step roadmap to understanding the political hypocrisy behind hemp bans, taking action, finding your role, and getting paid to make an actual difference.
                            </p>
                        </header>

                        <NavBar />

                        <section id="roadmap" className="mb-24 scroll-mt-8">
                            <SectionHeading
                                eyebrow="The Roadmap"
                                title="Seven Steps From Outrage to Impact"
                                subtitle="Work through them in order, or jump to whichever one matches where you are right now."
                            />
                            <Roadmap activeStep={activeStep} setActiveStep={setActiveStep} />
                        </section>

                        <section id="assessment" className="mb-24 scroll-mt-8">
                            <SectionHeading
                                eyebrow="Find Your Role"
                                title="What Skills Do You Already Have?"
                                subtitle="Everyone thinks they need to become a policy expert to help. Most of the time, you just need to point your existing skills at the problem. Take the 60-second assessment to find your entry point."
                            />
                            <SkillsAssessment onJumpToStep={jumpToStep} />
                        </section>

                        <section id="faq" className="mb-24 scroll-mt-8">
                            <SectionHeading
                                eyebrow="Glossary & FAQ"
                                title="Common Questions, Answered Straight"
                            />
                            <FaqSection />
                        </section>

                        <section id="community" className="mb-16 scroll-mt-8">
                            <SectionHeading
                                eyebrow="Community"
                                title="Discussion"
                                subtitle="Share a lead, a question, or what's happening in your area. Comments are public and visible to everyone."
                            />
                            <CommentsSection />
                        </section>

                        <footer className="text-center text-slate-600 text-sm pt-8 border-t border-slate-800">
                            <p>Built by a citizen, for citizens. Headlines refresh daily and are pulled automatically from public news sources.</p>
                        </footer>
                    </div>
                </React.Fragment>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
